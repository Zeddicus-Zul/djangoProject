<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jordan Bailey - Portfolio</title>
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portfolio-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
        }

        .portfolio-container h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .portfolio-container p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #ccc;
            line-height: 1.6;
        }

        .projects {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #680e0e;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .project-card:hover {
            background: rgba(104, 14, 14, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .project-card h3 {
            color: #680e0e;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .project-card p {
            margin: 0;
            color: #ddd;
            font-size: 1rem;
        }

        .project-card--soon {
            opacity: 0.75;
        }

        .badge-soon {
            font-size: 0.65rem;
            font-weight: normal;
            color: #ccc;
            border: 1px solid #680e0e;
            border-radius: 4px;
            padding: 2px 6px;
            vertical-align: middle;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <main>
        <div class="portfolio-container">
            <h1>Jordan Bailey</h1>
            <p>Aspiring Software Engineer | Game Enthusiast</p>
            
            <div class="projects">
                {% for project in projects %}
                <a href="{{ project.url }}" class="project-card{% if not project.available %} project-card--soon{% endif %}">
                    <h3>{{ project.title }}{% if not project.available %} <span class="badge-soon">Coming Soon</span>{% endif %}</h3>
                    <p>{{ project.description }}</p>
                </a>
                {% endfor %}
            </div>
        </div>
    </main>

    <footer>Work In Progress</footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
