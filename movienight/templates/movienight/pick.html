<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Night - Tonight's Pick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        .container-narrow {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: #680e0e;
            text-align: center;
            margin-bottom: 30px;
        }

        .mode-link {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .pick-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .trailer-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #680e0e;
            margin-bottom: 20px;
        }

        .trailer-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .empty-state {
            text-align: center;
            color: #ccc;
            margin-bottom: 20px;
        }

        .set-pick-form {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #680e0e;
            border-radius: 12px;
            padding: 20px 24px;
            margin-top: 30px;
        }

        .set-pick-form label {
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 4px;
            display: block;
        }

        .set-pick-form .mb-3 {
            margin-bottom: 15px;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #ccc;
        }
    </style>
</head>

<body>
    <main>
        <div class="container-narrow">
            <h1>Tonight's Pick</h1>

            <a href="{% url 'movienight:movie_night' %}" class="mode-link">&larr; Back to suggestions &amp; random pick</a>

            {% if current_pick %}
            <p class="pick-title">{{ current_pick.title }}</p>
            {% if youtube_id %}
            <div class="trailer-wrap">
                <iframe src="https://www.youtube.com/embed/{{ youtube_id }}" title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            {% endif %}
            {% else %}
            <p class="empty-state">No pick announced yet.</p>
            {% endif %}

            {% if can_set %}
            <form class="set-pick-form" method="post" action="{% url 'movienight:pick_curated' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="title">Movie title</label>
                    <input type="text" id="title" name="title" class="form-control" maxlength="200" required>
                </div>
                <div class="mb-3">
                    <label for="youtube_url">YouTube trailer link (optional)</label>
                    <input type="url" id="youtube_url" name="youtube_url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                </div>
                <button type="submit" class="btn btn-danger">Set Tonight's Pick</button>
            </form>
            {% endif %}

            <a href="/" class="back-link">&larr; Back to portfolio</a>
        </div>
    </main>

    <footer>Work In Progress</footer>
</body>

</html>
