<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Suggestion - Movie Night</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .edit-box {
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #680e0e;
            margin-bottom: 20px;
            text-align: center;
        }

        .edit-form {
            display: flex;
            gap: 10px;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ccc;
        }
    </style>
</head>

<body>
    <main>
        <div class="edit-box">
            <h1>Edit Suggestion</h1>
            <form class="edit-form" method="post">
                {% csrf_token %}
                <input type="text" name="title" class="form-control" value="{{ suggestion.title }}" maxlength="200" required>
                <button type="submit" class="btn btn-danger">Save</button>
            </form>
            <a href="{% url 'movienight:movie_night' %}" class="back-link">&larr; Cancel</a>
        </div>
    </main>

    <footer>Work In Progress</footer>
</body>

</html>
