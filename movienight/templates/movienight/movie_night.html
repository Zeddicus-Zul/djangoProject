<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Night</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        .container-narrow {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #680e0e;
            text-align: center;
            margin-bottom: 30px;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .add-form input {
            flex: 1;
        }

        .suggestion-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #680e0e;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suggestion-card .actions {
            display: flex;
            gap: 8px;
        }

        .suggestion-card form {
            margin: 0;
        }

        .empty-state {
            text-align: center;
            color: #ccc;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #ccc;
        }
    </style>
</head>

<body>
    <main>
        <div class="container-narrow">
            <h1>Movie Night</h1>

            <form class="add-form" method="post" action="{% url 'movienight:add_suggestion' %}">
                {% csrf_token %}
                <input type="text" name="title" class="form-control" placeholder="Suggest a movie..." maxlength="200" required>
                <button type="submit" class="btn btn-danger">Suggest</button>
            </form>

            {% if suggestions %}
                {% for item in suggestions %}
                <div class="suggestion-card">
                    <span>{{ item.obj.title }}</span>
                    {% if item.is_owner %}
                    <div class="actions">
                        <a href="{% url 'movienight:edit_suggestion' item.obj.pk %}" class="btn btn-sm btn-outline-light">Edit</a>
                        <form method="post" action="{% url 'movienight:delete_suggestion' item.obj.pk %}" onsubmit="return confirm('Delete this suggestion?');">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
            {% else %}
                <p class="empty-state">No suggestions yet &mdash; be the first!</p>
            {% endif %}

            <a href="/" class="back-link">&larr; Back to portfolio</a>
        </div>
    </main>

    <footer>Work In Progress</footer>
</body>

</html>
