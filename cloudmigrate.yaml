# cloudmigrate.yaml — build, run jobs (collectstatic+migrate), deploy

substitutions:
  _REGION: us-west1
  _REPOSITORY: portfoliosite
  _SERVICE_NAME: gun-sounds-app
  _SERVICE_ACCOUNT: 1096649553455-compute@developer.gserviceaccount.com   # your SA email
  _CLOUDSQL: portfoliosite-468605:us-west2:portfoliosite-database         # instance connection name
  _DB_NAME: gun_sounds_db
  _DB_USER: gun_sounds_user

steps:
  # 0) Build image with two tags: latest and the immutable $BUILD_ID
  - name: gcr.io/cloud-builders/docker
    args:
      [
        'build',
        '-t','us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest',
        '-t','us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID',
        '.'
      ]

  # 1) Push both tags
  - name: gcr.io/cloud-builders/docker
    args: ['push','us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest']
  - name: gcr.io/cloud-builders/docker
    args: ['push','us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID']

  # 2) (Re)create + run COLLECTSTATIC job on the new image tag
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run jobs delete run-collectstatic --region=$_REGION --quiet || true
        gcloud run jobs create run-collectstatic \
          --image us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID \
          --region $_REGION \
          --service-account $_SERVICE_ACCOUNT \
          --command=python \
          --args=manage.py,collectstatic,--noinput \
          --set-secrets=django_settings=django_settings:latest
        gcloud run jobs execute run-collectstatic --region=$_REGION --wait

  # 3) (Re)create + run MIGRATIONS job on the same image tag
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run jobs delete run-migrations --region=$_REGION --quiet || true
        gcloud run jobs create run-migrations \
          --image us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID \
          --region $_REGION \
          --service-account $_SERVICE_ACCOUNT \
          --command=python \
          --args=manage.py,migrate \
          --set-env-vars=DB_NAME=$_DB_NAME,DB_USER=$_DB_USER \
          --set-secrets=django_settings=django_settings:latest,DB_PASSWORD=db-password:latest \
          --set-cloudsql-instances=$_CLOUDSQL
        gcloud run jobs execute run-migrations --region=$_REGION --wait

  # 4) Deploy service using the SAME immutable tag (not latest)
  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        'run','deploy','$_SERVICE_NAME',
        '--image','us-west2-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID',
        '--platform','managed',
        '--region','$_REGION',
        '--allow-unauthenticated',
        '--service-account','$_SERVICE_ACCOUNT',
        '--add-cloudsql-instances','$_CLOUDSQL',
        '--set-env-vars','DB_NAME=$_DB_NAME,DB_USER=$_DB_USER',
        '--set-secrets','django_settings=django_settings:latest,DB_PASSWORD=db-password:latest'
      ]
