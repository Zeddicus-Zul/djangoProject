steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/gun-sounds-app', '.']

- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'deploy', 'gun-sounds-app',
         '--image', 'gcr.io/$PROJECT_ID/gun-sounds-app',
         '--platform', 'managed',
         '--region', 'us-west2',
         '--allow-unauthenticated',
         '--set-secrets', 'django_settings=django_settings:latest,superuser_password=superuser_password:latest']
