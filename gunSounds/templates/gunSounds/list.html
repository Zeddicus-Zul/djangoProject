<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Gun Sounds - Frontier 73C</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'gunSounds/styles.css' %}" />
</head>

<body>
    <h1>Gun Sounds</h1>

    {% for sound in sounds %}
    <div class="container">
        <h2>{{ sound.title }}</h2>
        <img src="{% static sound.img %}" width="400" height="auto" alt="{{ sound.title }}" />
        <div class="buttons">
            {% for clip in sound.audio_clips %}
            <button onclick="document.getElementById('audio-{{ forloop.parentloop.counter }}-{{ forloop.counter }}').play()">
                {{ clip.label }}
            </button>
            {% endfor %}
        </div>

        {% for clip in sound.audio_clips %}
        <audio id="audio-{{ forloop.parentloop.counter }}-{{ forloop.counter }}" src="{% static clip.path %}"></audio>
        {% endfor %}
    </div>
    {% endfor %}

</body>

</html>
