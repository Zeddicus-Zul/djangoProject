<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Gun Sounds</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'gunSounds/styles.css' %}" />
</head>

<body>
    <h1>Gun Sounds</h1>
    

    <!-- Filter/Sort Bar -->
    <form method="get" action=".">
        <label for="ammo_type">Ammo Type:</label>
        <select name="ammo_type" id="ammo_type">
            <option value="">All</option>
            {% for atype in ammo_types %}
                <option value="{{ atype }}" {% if atype == selected_ammo_type %}selected{% endif %}>{{ atype }}</option>
            {% endfor %}
        </select>

        <label for="size">Size:</label>
        <select name="size" id="size">
            <option value="">All</option>
            {% for s in sizes %}
                <option value="{{ s }}" {% if s == selected_size %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>

        <button type="submit">Apply</button>
    </form>

    <!-- Gun Display -->
    <div class="gun-grid">
        {% for gun in guns %}
            <div class="gun-box">
                <h2>{{ gun.name }}</h2>
                <img src="{{ gun.image.url }}" width="400" height="auto" alt="{{ gun.name }}" />

                <div class="buttons">
                    {% for clip in gun.audio_clips.all %}
                        <button onclick="document.getElementById('audio-{{ forloop.parentloop.counter }}-{{ forloop.counter }}').play()">
                            {{ clip.label }}
                        </button>
                    {% endfor %}
                </div>

                {% for clip in gun.audio_clips.all %}
                    <audio id="audio-{{ forloop.parentloop.counter }}-{{ forloop.counter }}" src="{{ clip.audio_file.url }}"></audio>
                {% endfor %}
            </div>
        {% endfor %}
    </div>

</body>

</html>
