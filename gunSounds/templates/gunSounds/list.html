<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Gun Sounds</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'gunSounds/styles.css' %}" />
    <style>
        /* Add some basic styling for the filter buttons */
        .filter-buttons {
            margin-bottom: 20px;
            text-align: center; /* Center the filter buttons */
        }
        .filter-buttons button {
            margin: 5px;
            padding: 8px 15px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .filter-buttons button:hover {
            background-color: #555;
            border-color: #777;
        }
        .filter-buttons button.active {
            background-color: #680e0e; /* Highlight for the selected filter */
            border-color: #881e1e;
        }
    </style>
</head>

<body>
    <h1>Gun Sounds</h1>

    <div class="filter-bar">
        <div class="filter-buttons">
            <span>Ammo Type:</span>
            <button
                onclick="window.location.href = `{% url 'sound_list' %}?size={{ selected_size }}`"
                class="{% if not selected_ammo_type %}active{% endif %}"
            >
                All
            </button>
            {% for atype in ammo_types %}
                <button
                    onclick="window.location.href = `{% url 'sound_list' %}?ammo_type={{ atype }}&size={{ selected_size }}`"
                    class="{% if atype == selected_ammo_type %}active{% endif %}"
                >
                    {{ atype }}
                </button>
            {% endfor %}
        </div>

        <div class="filter-buttons">
            <span>Size:</span>
            <button
                onclick="window.location.href = `{% url 'sound_list' %}?ammo_type={{ selected_ammo_type }}`"
                class="{% if not selected_size %}active{% endif %}"
            >
                All
            </button>
            {% for s in sizes %}
                <button
                    onclick="window.location.href = `{% url 'sound_list' %}?ammo_type={{ selected_ammo_type }}&size={{ s }}`"
                    class="{% if s == selected_size %}active{% endif %}"
                >
                    {{ s }}
                </button>
            {% endfor %}
        </div>
    </div>


    <div class="gun-grid">
        {% for gun in guns %}
            <div class="gun-box">
                <h2>{{ gun.name }}</h2>
                <img src="{{ gun.image.url }}" width="400" height="auto" alt="{{ gun.name }}" />

                <div class="buttons">
                    {% for clip in gun.audio_clips.all %}
                        <button onclick="document.getElementById('audio-{{ forloop.parentloop.counter }}-{{ forloop.counter }}').play()">
                            {{ clip.label }}
                        </button>
                    {% endfor %}
                </div>

                {% for clip in gun.audio_clips.all %}
                    <audio id="audio-{{ forloop.parentloop.counter }}-{{ forloop.counter }}" src="{{ clip.audio_file.url }}"></audio>
                {% endfor %}
            </div>
        {% endfor %}
    </div>
</body>

</html>
