<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gun Sounds - Master Your Arsenal</title>
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'gunSounds/styles.css' %}" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-container {
            text-align: center;
            padding: 40px 20px;
        }

        .landing-container h1 {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .landing-container p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #ccc;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 50px;
            font-size: 1.3rem;
            background-color: #680e0e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 2px solid #680e0e;
        }

        .cta-button:hover {
            background-color: #881e1e;
            border-color: #881e1e;
            transform: scale(1.05);
            color: white;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <main>
        <div class="landing-container">
            <h1>Gun Sounds Library</h1>
            <p>Master your arsenal. Learn every weapon sound in Hunt Showdown.</p>
            <a href="{% url 'home' %}" class="cta-button">Enter the Library</a>
        </div>
    </main>

    <footer>Created by Jordan Bailey</footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
