<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Gun Sounds</title>
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'gunSounds/styles.css' %}">
</head>
<body>
    <!-- Site Header -->
    <header class="d-flex flex-wrap align-items-center justify-content-center py-3 px-3 border-bottom text-bg-dark">
        <a class="nav-link d-flex align-items-center mb-2 mb-md-0 me-md-auto text-white" href="{% url 'landing' %}">&larr; Portfolio</a>
        <ul class="nav nav-pills" style="--bs-nav-pills-link-active-bg:#680e0e;">
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'home' %}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'quiz' %}">Quiz</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'map' %}">Map</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'about' %}">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'contact' %}">Contact</a>
            </li>
            {% if user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'logout' %}">Logout ({{user.username}})</a>
            </li>
            {% else %}
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'login' %}">Login</a>
            </li>
            {% endif %}
            <li class="nav-item">
                <a class="nav-link text-white" href="/admin" target="_blank">Admin</a>
            </li>
        </ul>
    </header>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h1 class="card-title text-center">Join</h1>
                        <form method="POST">{% csrf_token %}
                            <table class="table">
                                {{ join_form.as_table }}
                            </table>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Join</button>
                            </div>
                            <p class="text-center mt-3">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
